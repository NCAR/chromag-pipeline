# This file specifies various parameters used by the pipeline. Values may
# change over the life of the instrument. This file specifies the type of the
# variable and potentially an initial value, whereas `epochs.cfg` specifies the
# changes at specified dates. All values set in `epochs.cfg` must be for
# parameters defined in this file.

[DEFAULT]
# whether data files should be processed
process                   : type=boolean, default=YES

# image dimensions
nx                        : type=int, default=2560
ny                        : type=int, default=2160

# TODO: set this to the correct value
plate_scale               : type=float, default=0.0

distortion_basename       : type=str
