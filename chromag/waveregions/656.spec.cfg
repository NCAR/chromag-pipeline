# This file specifies various parameters used by the pipeline specific to the
# 656 nm wave region. Values may change over the life of the instrument. This
# file specifies the type of the parameter and potentially an initial value,
# whereas `656.cfg` specifies the changes at specified dates. All values set
# in `656.cfg` must be for parameters defined in this file.

# Using ColorBrewer2 Pastel1 with 5 data classes to get the colors to use for
# the different wave region colors.

[DEFAULT]
center_wavelength  : type=float, default=656.3

platescale         : type=float, default=5.954

name               : type=str, default=H I
doi                : type=str, default=https://doi.org/xx.xxxx/xxxxxxxx
nickname           : type=str, default=red line (H-alpha)
ionization         : type=str, default=HI
color              : type=str, default=#ccebc5
colormap           : type=str, default=Reds_r

display_i_min      : type=float, default=0.0
display_i_max      : type=float, default=525.0
display_i_exp      : type=float, default=0.7
display_i_gamma    : type=float, default=0.7

display_qu_min     : type=float, default=0.0
display_qu_max     : type=float, default=525.0
display_qu_exp     : type=float, default=1.0
display_qu_gamma   : type=float, default=0.7

display_v_min      : type=float, default=0.0
display_v_max      : type=float, default=525.0
display_v_exp      : type=float, default=1.0
display_v_gamma    : type=float, default=0.7
